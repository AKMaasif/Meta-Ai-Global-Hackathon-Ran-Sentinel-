<svg viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="Detection compared with common methods" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="250" fill="#ffffff"/><text x="10" y="18" font-size="10.5" fill="#1f2328" text-anchor="start" font-weight="600" >A. Simulator: faults detected (48 injected), false alarms in 108 normal cell-days = 0 for all</text><text x="188" y="46" font-size="10" fill="#1f2328" text-anchor="end" font-weight="400" >Threshold rules only</text><rect x="196" y="34" width="103.0" height="16" fill="#9ca3af"/><text x="304.96000000000004" y="46" font-size="10" fill="#1f2328" text-anchor="start" font-weight="600" >79.2%</text><text x="188" y="70" font-size="10" fill="#1f2328" text-anchor="end" font-weight="400" >Isolation Forest only</text><rect x="196" y="58" width="73.1" height="16" fill="#9ca3af"/><text x="275.06" y="70" font-size="10" fill="#1f2328" text-anchor="start" font-weight="600" >56.2%</text><text x="188" y="94" font-size="10" fill="#1f2328" text-anchor="end" font-weight="400" >Per-cell baseline only</text><rect x="196" y="82" width="84.0" height="16" fill="#9ca3af"/><text x="285.98" y="94" font-size="10" fill="#1f2328" text-anchor="start" font-weight="600" >64.6%</text><text x="188" y="118" font-size="10" fill="#1f2328" text-anchor="end" font-weight="700" >RAN Sentinel (all three)</text><rect x="196" y="106" width="130.0" height="16" fill="#0f5c5c"/><text x="332.0" y="118" font-size="10" fill="#1f2328" text-anchor="start" font-weight="600" >100.0%</text><text x="10" y="150" font-size="10.5" fill="#1f2328" text-anchor="start" font-weight="600" >B. TelecomTS 5G test set (6,400 windows), no labels: F1 score</text><text x="188" y="178" font-size="10" fill="#1f2328" text-anchor="end" font-weight="400" >Isolation Forest</text><rect x="196" y="166" width="59.8" height="16" fill="#9ca3af"/><text x="261.8" y="178" font-size="10" fill="#1f2328" text-anchor="start" font-weight="600" >0.23</text><text x="188" y="202" font-size="10" fill="#1f2328" text-anchor="end" font-weight="400" >PCA, context baseline</text><rect x="196" y="190" width="135.2" height="16" fill="#9ca3af"/><text x="337.20000000000005" y="202" font-size="10" fill="#1f2328" text-anchor="start" font-weight="600" >0.52</text><text x="188" y="226" font-size="10" fill="#1f2328" text-anchor="end" font-weight="700" >RAN Sentinel method</text><rect x="196" y="214" width="158.6" height="16" fill="#0f5c5c"/><text x="360.6" y="226" font-size="10" fill="#1f2328" text-anchor="start" font-weight="600" >0.61</text><rect x="420" y="40" width="210" height="190" fill="#f8fafc" stroke="#e5e7eb" rx="6"/><text x="434" y="62" font-size="10.5" fill="#1f2328" text-anchor="start" font-weight="700" >Why it matters</text><text x="434" y="76" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >Threshold rules are the usual</text><text x="434" y="90" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >first line in a NOC. Alone they</text><text x="434" y="104" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >missed 10 of 48 faults here.</text><text x="434" y="118" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" ></text><text x="434" y="132" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >Combining rules, an Isolation</text><text x="434" y="146" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >Forest and a per-cell, per-hour</text><text x="434" y="160" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >baseline caught all 48 with no</text><text x="434" y="174" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >false alarms.</text><text x="434" y="188" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" ></text><text x="434" y="202" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >Measured in this project;</text><text x="434" y="216" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >the simulator is our own.</text></svg>