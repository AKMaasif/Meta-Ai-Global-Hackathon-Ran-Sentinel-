<svg viewBox="0 0 640 270" width="640" height="270" role="img" aria-label="TAM SAM SOM" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="270" fill="#ffffff"/><circle cx="175" cy="140" r="120" fill="#cfe3e3" stroke="#5fa3a3"/><circle cx="175" cy="188" r="70" fill="#5fa3a3" opacity=".85"/><circle cx="175" cy="232" r="26" fill="#0f5c5c"/><text x="175" y="66" font-size="12" fill="#0f5c5c" text-anchor="middle" font-weight="700" >TAM</text><text x="175" y="82" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="400" >$7.0B / yr</text><text x="175" y="162" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" >SAM</text><text x="175" y="177" font-size="11" fill="#fff" text-anchor="middle" font-weight="400" >$1.4B / yr</text><text x="175" y="236" font-size="10" fill="#fff" text-anchor="middle" font-weight="700" >SOM</text><rect x="330" y="32" width="12" height="12" fill="#cfe3e3" stroke="#5fa3a3"/><text x="350" y="43" font-size="12" fill="#1f2328" text-anchor="start" font-weight="700" >TAM  $7.0B</text><text x="350" y="60" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >SON and RAN automation software, worldwide, 2025 </text><text x="350" y="73" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >(IMARC). Sourced figure. </text><rect x="330" y="106" width="12" height="12" fill="#5fa3a3" stroke="#5fa3a3"/><text x="350" y="117" font-size="12" fill="#1f2328" text-anchor="start" font-weight="700" >SAM  $1.4B</text><text x="350" y="134" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >20% of TAM: mid-size, regional and multi-vendor </text><text x="350" y="147" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >operators without in-house AI operations teams. </text><text x="350" y="160" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >Assumption. </text><rect x="330" y="180" width="12" height="12" fill="#0f5c5c" stroke="#5fa3a3"/><text x="350" y="191" font-size="12" fill="#1f2328" text-anchor="start" font-weight="700" >SOM  $7–14M</text><text x="350" y="208" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >0.5–1% of SAM in year 5, cross-checked bottom-up </text><text x="350" y="221" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400" >below. Assumption. </text></svg>